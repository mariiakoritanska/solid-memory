<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Терпіти істерики?</title>
    <link href="https://fonts.googleapis.com/css2?family=Nostalgic+Remains&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffe6e6;
            margin: 0;
            font-family: 'Nostalgic Remains', cursive;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        h1 {
            font-size: 64px;
            margin: 0 0 40px 0;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        button {
            font-size: 32px;
            padding: 22px 48px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .yes {
            background-color: #ff4d4d;
            color: white;
        }

        .no {
            background-color: #cccccc;
            color: black;
        }

        .heart {
            position: absolute;
            font-size: 52px;
            animation: fall 7s linear infinite;
            text-shadow: 0 0 12px #ff69b4;
        }

        @keyframes fall {
            0% { top: -10%; opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }
    </style>
</head>
<body>
    <audio autoplay loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
        Ваш браузер не підтримує звук.
    </audio>

    <h1>Чи готовий ти терпіти мої істерики вічно? 💘</h1>

    <div class="button-group">
        <a href="{{ url_for('yes') }}"><button class="yes" id="yesBtn">Так!</button></a>
        <button class="no" id="noBtn">Ні</button>
    </div>

    <script>
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");

        const noMessages = [
            "Може, передумаєш? 🥺",
            "Не будь жорстоким 😢",
            "Краще натисни 'Так' 😌",
            "Я не хочу чути 'Ні' 😿",
            "Це ж любов, правда? 💗",
            "Не роби мені боляче 🙃",
            "Та натисни вже 'Так'! 😍",
            "Навіщо ти так зі мною 😭",
            "Кохання перемагає все 💞",
            "Я знаю, що ти погодишся 💕"
        ];

        function getRandomMessage() {
            return noMessages[Math.floor(Math.random() * noMessages.length)];
        }

        function enlargeYesButton() {
            let currentScale = parseFloat(yesBtn.getAttribute("data-scale")) || 1;
            currentScale += 0.3;
            yesBtn.style.transform = `scale(${currentScale})`;
            yesBtn.setAttribute("data-scale", currentScale.toFixed(2));
        }

        function shrinkNoButton() {
            let currentScale = parseFloat(noBtn.getAttribute("data-scale")) || 1;
            currentScale = Math.max(0.6, currentScale - 0.07);
            noBtn.style.transform = `scale(${currentScale}) translateX(20px)`;
            noBtn.setAttribute("data-scale", currentScale.toFixed(2));
        }

        noBtn.addEventListener("mouseover", function () {
            noBtn.innerText = getRandomMessage();
            enlargeYesButton();
            shrinkNoButton();
        });

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
            heart.innerText = ["💗","💖","💘","💕","💓"][Math.floor(Math.random() * 5)];
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 8000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
