<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кохання</title>
    <link href="https://fonts.cdnfonts.com/css/mansfield" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Mansfield', sans-serif;
            text-align: center;
            position: relative;
        }
        img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: white;
            text-shadow: 2px 2px 6px #000000;
        }
    </style>
</head>
<body>
    <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="котик">
    <div class="text-overlay">Я тебе люблю, котя 💘</div>
</body>
</html>
